    <style>
      /* Paint dark and show a splash before the app's CSS and JS load. */
      html, body { margin: 0; background: #07080f; color-scheme: dark; }
      .boot { position: fixed; inset: 0; z-index: 100; background: #07080f; transition: opacity .5s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
      .boot svg { display: block; width: 230px; height: auto; }
      .boot .orb { transform-box: fill-box; transform-origin: center; animation: boot-pulse 1.6s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { transform: scale(.8); opacity: .75; } }
      .boot.is-hidden { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { .boot .orb { animation: none; } .boot { transition-duration: .2s; } }
    </style>
